name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Package extension
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          npm run package -- --out "qmd-search-$version.vsix"
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --verify-tag --generate-notes --title "QMD Search ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
